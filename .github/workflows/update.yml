# KOSPI4848 자동 업데이트
# GitHub 서버가 정해진 시간에 예측 프로그램을 돌리고, 결과를 사이트에 반영해요.
# 시간은 UTC 기준이에요 (한국시간 = UTC + 9시간). GitHub 예약 실행은 몇 분~20분 늦게 시작될 수 있어요.
name: update

on:
  schedule:
    - cron: "45 22 * * 0-4"   # 한국시간 평일 07:45  아침 (지난밤 미국장 반영)
    - cron: "32 0 * * 1-5"    # 한국시간 평일 09:32  오전 예측 (시작가 반영)
    - cron: "35 3 * * 1-5"    # 한국시간 평일 12:35  오후 예측
    - cron: "15 7 * * 1-5"    # 한국시간 평일 16:15  실제 결과 기록
  workflow_dispatch: {}        # GitHub 화면에서 직접 실행 버튼

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 예측 계산
        env:
          TZ: Asia/Seoul
        run: python predictor/build.py

      - name: 결과 저장 (기록이 다음 실행에도 이어지도록)
        run: |
          git config user.name "kospi4848-bot"
          git config user.email "kospi4848-bot@users.noreply.github.com"
          git add site/
          git diff --cached --quiet || git commit -m "자동 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
