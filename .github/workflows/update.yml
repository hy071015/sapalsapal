# 사팔사팔 자동 업데이트
# GitHub 서버가 정해진 시간에 예측 프로그램을 돌리고, 결과를 사이트에 반영해요.
# 시간은 UTC 기준이에요 (한국시간 = UTC + 9시간).
# GitHub 예약 실행은 서버가 바쁘면 수십 분 늦거나 빠질 수 있어서(2026-11-23: 07:45→08:26, 09:32 누락)
# 단계마다 예비 시간을 둬요. 오전·오후 예측은 처음 성공한 값이 남고 예비 실행이 덮어쓰지 않아요.
name: update

on:
  schedule:
    - cron: "45 22 * * 0-4"   # 한국시간 평일 07:45  아침 (지난밤 미국장 반영)
    - cron: "20 23 * * 0-4"   #               08:20  아침 예비
    - cron: "32 0 * * 1-5"    #               09:32  오전 예측 (시작가 반영)
    - cron: "45 0 * * 1-5"    #               09:45  오전 예비
    - cron: "5 1 * * 1-5"     #               10:05  오전 예비
    - cron: "30 1 * * 1-5"    #               10:30  오전 예비
    - cron: "35 3 * * 1-5"    #               12:35  오후 예측
    - cron: "55 3 * * 1-5"    #               12:55  오후 예비
    - cron: "20 4 * * 1-5"    #               13:20  오후 예비
    - cron: "15 7 * * 1-5"    #               16:15  실제 결과 기록
    - cron: "0 8 * * 1-5"     #               17:00  결과 예비
  workflow_dispatch:           # GitHub 화면에서 직접 실행 버튼
    inputs:
      mode:
        description: "강제 단계 (비워두면 시간에 맞게 자동): morning / open / midday / evening"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 예측 계산
        env:
          TZ: Asia/Seoul
          MODE: ${{ github.event.inputs.mode }}
        run: python predictor/build.py ${MODE:+--mode "$MODE"}

      - name: 결과 저장 (기록이 다음 실행에도 이어지도록)
        run: |
          git config user.name "sapalsapal-bot"
          git config user.email "sapalsapal-bot@users.noreply.github.com"
          git add site/
          git diff --cached --quiet || git commit -m "자동 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
