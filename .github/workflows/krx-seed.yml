# KRX 과거 VKOSPI를 GitHub 내부 캐시(비공개)에 처음 한 번 채워두는 작업 (약 1시간, 수동 실행)
# 중간에 끊겨도 받은 만큼은 저장되니, 다시 실행하면 이어서 받아요.
name: krx-seed

on:
  workflow_dispatch: {}

concurrency:
  group: krx-seed

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache/restore@v4
        with:
          path: data_private/krx_api
          key: krx-${{ github.run_id }}
          restore-keys: krx-

      - name: VKOSPI 과거 자료 받기
        env:
          TZ: Asia/Seoul
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python predictor/krx_api.py

      - name: 받은 만큼 저장 (실패해도)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data_private/krx_api
          key: krx-${{ github.run_id }}
